{% extends "base.html" %}
{% block title %}Create account - GymLog{% endblock %}
{% block content %}
<div class="auth">
  <h1>Create account</h1>
  <div class="card">
    <form method="post" class="stack">
      <div><label for="full_name">Name</label><input id="full_name" name="full_name" required></div>
      <div><label for="username">Username</label><input id="username" name="username" required></div>
      <div><label for="email">Email</label><input id="email" name="email" type="email" required></div>
      <div><label for="password">Password</label><input id="password" name="password" type="password" required></div>
      <div class="field-row">
        <div><label for="birth_date">Born</label><input id="birth_date" name="birth_date" type="date"></div>
        <div><label for="height_cm">Height (cm)</label><input id="height_cm" name="height_cm" type="number" step="0.5" min="100" max="250"></div>
        <div><label for="gender">Gender</label>
          <select id="gender" name="gender">
            <option value="">-</option><option value="male">Male</option>
            <option value="female">Female</option><option value="other">Other</option>
          </select></div>
      </div>
      <button type="submit">Create account</button>
    </form>
  </div>
  <p><a href="{{ url_for('login') }}">Back to log in</a></p>
</div>
{% endblock %}
